name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only run if CI passes
    needs: []  # Add 'test' job from ci.yaml if you want to require CI to pass first

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Railway
        uses: railwayapp/railway-github-link@v1
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
