# Telegram channels to monitor
# Add channel usernames (without @) or channel IDs
telegram_channels:
  # - VahidOnline
  - akhbar_montakhab
  - cataphract1
  - defence_news
  - Parvazdaroj
  - geopoliticintel

# RSS feeds for international news
rss_feeds:
  - name: "Reuters Middle East (via Google News)"
    url: "https://news.google.com/rss/search?q=site:reuters.com+middle+east&ceid=US:en&hl=en-US&gl=US"

  - name: "BBC Persian"
    url: "https://feeds.bbci.co.uk/persian/rss.xml"

  - name: "Al Jazeera"
    url: "https://www.aljazeera.com/xml/rss/all.xml"

  - name: "New York Times World"
    url: "https://rss.nytimes.com/services/xml/rss/nyt/World.xml"

  - name: "The Guardian World"
    url: "https://www.theguardian.com/world/rss"

# Iran filter configuration (only applied to RSS feeds)
iran_filter:
  enabled: true
  keywords:
    - "iran"
    - "iranian"
    - "tehran"
    - "persia"
    - "persian"
    - "islamic republic"
    - "ایران"
    - "تهران"
    - "ایرانی"
    - "جمهوری اسلامی"

# Cloudflare Radar monitoring for internet traffic anomalies
# Requires CLOUDFLARE_API_TOKEN environment variable
radar_monitor:
  enabled: true
  location: "IR"  # ISO country code
  interval_minutes: 60  # Check every hour (matches data granularity)
  change_threshold_percent: 5.0  # Alert on >=5% change hour-over-hour
  alert_cooldown_hours: 0  # 0 = alert every hour if threshold met

# Deduplication configuration (LLM-based entity extraction)
deduplication:
  enabled: true
  similarity_threshold: 0.6  # 60% entity overlap = duplicate
  keyword_similarity_threshold: 0.3  # 30% keyword overlap required
  ttl_days: 3                # Keep fingerprints for 3 days

# Reflective adaptive summary cadence (disabled by default).
# When enabled, the summary interval shortens as news intensity rises (a surge)
# and decays back toward SUMMARY_INTERVAL_MINUTES as things calm. Intensity is a
# pre-dedup filtered message RATE (messages per minute) judged against the
# rolling median baseline; a Cloudflare Radar outage promotes one level. Every
# interval change posts a Persian notice (reason + old-to-new interval) to the
# output channels.
adaptive_cadence:
  enabled: true            # Master switch; keep false to preserve fixed cadence
  min_interval_minutes: 30  # Floor cadence during a surge (vs 6h baseline)
  # max_interval_minutes: 60  # Optional ceiling; omit to cap at the baseline
  baseline_window: 10      # Recent rate samples kept for the baseline (median)
  elevated_ratio: 2.0      # rate >= elevated_ratio * baseline => ELEVATED (~half interval)
  surge_ratio: 4.0         # rate >= surge_ratio * baseline => SURGE (min_interval)
  decay_factor: 1.5        # Interval grows by this factor per calm run when decaying
  min_baseline_rate: 0.1   # Floor for the baseline rate, in MESSAGES PER MINUTE
  fast_escalation: false   # Run a cheap escalate-only probe between summary runs
  probe_interval_minutes: 5  # Probe cadence when fast_escalation is on
