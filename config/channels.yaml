# Telegram channels to monitor
# Add channel usernames (without @) or channel IDs
telegram_channels:
  - VahidOnline

# RSS feeds for international news
rss_feeds:
  - name: "Reuters Middle East"
    url: "https://www.reutersagency.com/feed/?best-regions=middle-east&post_type=best"

  - name: "BBC Persian"
    url: "https://feeds.bbci.co.uk/persian/rss.xml"

  - name: "Al Jazeera"
    url: "https://www.aljazeera.com/xml/rss/all.xml"

  - name: "New York Times World"
    url: "https://rss.nytimes.com/services/xml/rss/nyt/World.xml"

  - name: "The Guardian World"
    url: "https://www.theguardian.com/world/rss"

# Iran filter configuration (only applied to RSS feeds)
iran_filter:
  enabled: true
  keywords:
    - "iran"
    - "iranian"
    - "tehran"
    - "persia"
    - "persian"
    - "islamic republic"
    - "ایران"
    - "تهران"
    - "ایرانی"
    - "جمهوری اسلامی"
